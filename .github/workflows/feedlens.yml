name: FeedLens checks
on:
  push:
    branches: [feedlens-demo, main]
  pull_request:
    branches: [main, feedlens-demo]
permissions:
  contents: read
concurrency:
  group: feedlens-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: FeedLens
    steps:
      # Every action is pinned to a full commit SHA, and repository policy rejects
      # anything that is not, so a retagged release cannot change what CI runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FeedLens/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      # npm exec --no keeps the run on the locked devDependency instead of
      # resolving a fresh package from the registry at run time.
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build -- --base=./
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FeedLens-preview
          path: FeedLens.html
          retention-days: 14
          if-no-files-found: error
      # Only the build produced above is published, so the live site is always a
      # reviewed commit that passed the tests.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: FeedLens/dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
