name: FeedLens checks
on:
  push:
    branches: [feedlens-demo, main]
  pull_request:
    branches: [main, feedlens-demo]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FeedLens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: FeedLens/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: FeedLens-preview
          path: FeedLens.html
          if-no-files-found: error
